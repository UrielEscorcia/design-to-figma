name: Release

# On every push to main that changes the plugin version: run the checks, then publish the tag,
# the GitHub release (notes from CHANGELOG.md) and the Desktop zip. Existing releases are skipped,
# so a rerun (or a manual run from main) is safe.
on:
  push:
    branches: [main]
    paths: ['.claude-plugin/plugin.json']
  workflow_dispatch:

permissions:
  contents: write

# One run per commit: a second version bump never cancels or drops the release of the first.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    # Manual runs can target any branch; only main publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          # The release script uses GH_TOKEN through gh; git needs no stored credentials.
          persist-credentials: false
      - name: Checks
        run: tests/run.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -oE '"version": *"[^"]+"' .claude-plugin/plugin.json | grep -oE '[0-9][^"]*')"
          scripts/release.sh "$version" "$GITHUB_SHA"
